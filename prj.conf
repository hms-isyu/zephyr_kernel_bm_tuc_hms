# Peripherals
CONFIG_GPIO=y
CONFIG_UART_CONSOLE=n
CONFIG_UART_MCUX_LPUART=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_FPU=n

# Memory and execution
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_TRUSTED_EXECUTION_SECURE=n
CONFIG_CACHE=n
CONFIG_XIP=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_BT=n
CONFIG_FORCE_NO_ASSERT=y

# Code and algorithm
CONFIG_DEBUG=y

# Kernel
CONFIG_TIMESLICING=n
CONFIG_TICKLESS_KERNEL=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100
CONFIG_EVENTS=y
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_SCHED_MULTIQ=n


# Compiler and library
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y
CONFIG_DEBUG_OPTIMIZATIONS=y

# Benchmark
CONFIG_BMTH_ENABLE=y
CONFIG_BMTH_FRDM_MCXN947=y
CONFIG_BENCHMARK_TEST_MEM_BLOCKS=y

# The value of MEM_ARENA_BYTES in timing/mem/mem_harness.h, that is
# MEM_ARENA_HEADROOM * MEM_ARENA_SIZE, 4 * 1024. Only read by the k_malloc
# test, which cannot declare its own storage: kernel/mempool.c sizes the system
# heap through Z_HEAP_MIN_SIZE_FOR() of this symbol, so this is how k_malloc
# gets the same headroom arena the other two heap adapters declare directly.
# This file cannot hold a macro, so the BUILD_ASSERT in k_malloc.c is what
# enforces the agreement.
#
# CONFIG_SYS_HEAP_RUNTIME_STATS is deliberately absent and must stay absent: it
# adds counter maintenance to the allocate and the free path, which are the
# paths W1 through W5 measure, and an instrument inside the measured path
# breaks comparability with every number already taken.
CONFIG_HEAP_MEM_POOL_SIZE=4096
